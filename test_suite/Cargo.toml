[package]
name = "test_suite"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nutype = { path = "../nutype"}
# 1.0.119 is the first version that detects enabled crate features in the new
# Cargo build-dir layout (default since Cargo 1.100). Older versions silently
# build the UI fixtures with no features enabled.
trybuild = { version = "1.0.119", features = ["diff"] }

serde = { version = "1.0.150", optional = true }
serde_json = { version = "1.0.89", optional = true }
schemars = { version = "0.8", optional = true }
lazy_static = { version = "1", optional = true }
regex = { version = "1", optional = true }
once_cell = { version = "1", optional = true }
arbitrary = "1.3.0"
impls = "1"
arbtest = "0.2.0"
ron = "0.8.1"
rmp-serde = "1.1.2"
num = "0.4.3"
thiserror = "1.0.63"
valuable = { version = "0.1.1", features = ["derive"], optional = true }
# `rust-fuzz` provides `impl Arbitrary for Decimal`; `serde` provides its serde impls.
rust_decimal = { version = "1", features = ["rust-fuzz", "serde"], optional = true }
rust_decimal_macros = { version = "1", optional = true }

[features]
serde = ["nutype/serde", "dep:serde", "dep:serde_json"]
regex = ["nutype/regex", "dep:regex", "dep:lazy_static", "dep:once_cell"]
arbitrary = ["nutype/arbitrary"]
schemars08 = ["schemars"]
new_unchecked = []
ui = []
valuable = ["nutype/valuable", "dep:valuable"]
rust_decimal = ["nutype/rust_decimal", "dep:rust_decimal", "dep:rust_decimal_macros"]
